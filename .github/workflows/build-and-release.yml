name: Build and Release

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Beacon
    runs-on: macos-26

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Run unit tests
        run: |
          set -euo pipefail
          xcodebuild test \
            -project Beacon.xcodeproj \
            -scheme Beacon \
            -destination "platform=macOS" \
            -derivedDataPath test-build \
            -only-testing:BeaconTests \
            CODE_SIGNING_ALLOWED=NO

      - name: Build universal release
        run: |
          set -euo pipefail

          version="0.0.0"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Release tags must use the format v1.2.3" >&2
              exit 1
            fi
            version="${GITHUB_REF_NAME#v}"
          fi

          xcodebuild build \
            -project Beacon.xcodeproj \
            -scheme Beacon \
            -configuration Release \
            -destination "generic/platform=macOS" \
            -derivedDataPath build \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            MARKETING_VERSION="${version}" \
            CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Ad-hoc sign and verify application
        run: |
          set -euo pipefail
          app="build/Build/Products/Release/Beacon.app"

          expected_version="0.0.0"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            expected_version="${GITHUB_REF_NAME#v}"
          fi
          app_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "${app}/Contents/Info.plist")"
          if [[ "${app_version}" != "${expected_version}" ]]; then
            echo "App version ${app_version} does not match expected version ${expected_version}" >&2
            exit 1
          fi

          codesign --force --deep --options runtime --sign - "${app}"
          codesign --verify --deep --strict --verbose=2 "${app}"
          lipo -archs "${app}/Contents/MacOS/Beacon" | grep -q arm64
          lipo -archs "${app}/Contents/MacOS/Beacon" | grep -q x86_64

      - name: Create ZIP, DMG, and PKG
        run: |
          set -euo pipefail
          mkdir -p dist

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            package_name="Beacon-${GITHUB_REF_NAME}"
          else
            package_name="Beacon-build-${GITHUB_RUN_NUMBER}"
          fi

          app="build/Build/Products/Release/Beacon.app"

          ditto -c -k --sequesterRsrc --keepParent \
            "${app}" \
            "dist/${package_name}.zip"

          mkdir -p dmg-root
          ditto "${app}" "dmg-root/Beacon.app"
          ln -s /Applications "dmg-root/Applications"
          hdiutil create \
            -volname "Beacon" \
            -srcfolder "dmg-root" \
            -ov \
            -format UDZO \
            "dist/${package_name}.dmg"

          pkgbuild \
            --component "${app}" \
            --install-location "/Applications" \
            "dist/${package_name}.pkg"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: Beacon-build
          path: |
            dist/*.dmg
            dist/*.pkg
            dist/*.zip
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release files
        uses: actions/download-artifact@v8
        with:
          name: Beacon-build
          path: dist

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" \
            dist/*.dmg \
            dist/*.pkg \
            dist/*.zip \
            --verify-tag \
            --generate-notes \
            --title "Beacon ${GITHUB_REF_NAME}"
